{exp:form_submission:form form_name="contact" return="home/contact-sent" id="contact-form"}
  <div class="row g-3">
    <div class="col-sm-6">
      <label for="cf-name" class="form-label">Your name</label>
      <input type="text" class="form-control" id="cf-name" name="first_name" autocomplete="name" required>
    </div>
    <div class="col-sm-6">
      <label for="cf-from" class="form-label">Email address</label>
      <input type="email" class="form-control" id="cf-from" name="email" autocomplete="email" required>
    </div>
    <div class="col-12">
      <label for="cf-subject" class="form-label">Subject</label>
      <select class="form-select" id="cf-subject" name="subject">
        <option>General question</option>
        <option>Making a donation</option>
        <option>Volunteering</option>
        <option>Newsletter</option>
        <option>Something else</option>
      </select>
    </div>
    <div class="col-12">
      <label for="cf-message" class="form-label">Message</label>
      <textarea class="form-control" id="cf-message" name="message" rows="7" required></textarea>
    </div>
    <div class="col-12">
      <button type="submit" class="btn btn-navy btn-lg">Send message</button>
    </div>
  </div>
{/exp:form_submission:form}
